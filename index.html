<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מתכוננים למבחן באנגלית – כיתה ו'</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ea; --card:#fffdf8; --ink:#1f2433; --muted:#6b6f7c; --line:#e3ddd0;
  --brand:#2b59c3; --brand-soft:#e3ebfb; --ok:#1f8a4c; --ok-soft:#dff3e6;
  --bad:#c0392b; --bad-soft:#fbe3df; --warn:#b7791f; --warn-soft:#fdf0d5;
  --easy:#2f9e6b; --mid:#d98a1c; --hard:#c4453a; --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Rubik",system-ui,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px}
.en{direction:ltr;unicode-bidi:isolate;font-family:"Rubik",system-ui,sans-serif}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:28px;margin:0;font-weight:800;letter-spacing:-.3px}
.sub{color:var(--muted);margin:4px 0 0;font-size:16px}
.exam-chip{background:var(--ink);color:#fff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:15px;white-space:nowrap}
.howto{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px;margin-bottom:18px;font-size:16px;color:#3b3f4c}
.howto b{color:var(--ink)}
.section-title{font-size:15px;font-weight:700;color:var(--muted);margin:22px 4px 10px;text-transform:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.topic{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px}
.topic .t-head{display:flex;gap:10px;align-items:center}
.topic .icon{font-size:28px;width:46px;height:46px;display:grid;place-items:center;background:var(--brand-soft);border-radius:12px;flex:none}
.topic h3{margin:0;font-size:19px;line-height:1.25}
.topic p{margin:0;color:var(--muted);font-size:14.5px}
.levels{display:flex;gap:8px;margin-top:auto}
.lvl{flex:1;border:0;border-radius:12px;padding:9px 4px 7px;font:inherit;font-size:15px;font-weight:700;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;transition:transform .08s}
.lvl:active{transform:scale(.97)}
.lvl.l0{background:var(--easy)} .lvl.l1{background:var(--mid)} .lvl.l2{background:var(--hard)}
.lvl .stars{font-size:12px;letter-spacing:1px;opacity:.95;min-height:16px}
.resetall{margin-top:26px;text-align:center}
.linkbtn{background:none;border:0;color:var(--muted);font:inherit;font-size:14px;text-decoration:underline;cursor:pointer}

/* quiz */
.qbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.back{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 14px;font:inherit;font-size:15px;cursor:pointer}
.qtitle{font-weight:700;font-size:17px;flex:1}
.badge{border-radius:999px;padding:3px 10px;color:#fff;font-size:13px;font-weight:700;margin-inline-start:6px}
.badge.l0{background:var(--easy)} .badge.l1{background:var(--mid)} .badge.l2{background:var(--hard)}
.progress{height:10px;background:#e7e1d3;border-radius:999px;overflow:hidden;margin-bottom:16px}
.progress>div{height:100%;background:var(--brand);width:0;transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.qnum{color:var(--muted);font-size:14px;margin-bottom:6px}
.qtext{font-size:21px;font-weight:500;margin-bottom:16px}
.qtext .big{font-size:26px;font-weight:800}
.hint{color:var(--muted);font-size:15px;margin:-8px 0 14px}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 16px;font:inherit;font-size:19px;cursor:pointer;text-align:start;transition:border-color .1s, background .1s}
.opt:hover:not(:disabled){border-color:var(--brand)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.opt.en-opt{direction:ltr;text-align:left}
.speak{border:0;background:var(--brand-soft);border-radius:10px;padding:4px 10px;cursor:pointer;font-size:18px;vertical-align:middle;margin-inline-start:6px}
input.ans,textarea.ans{width:100%;font:inherit;font-size:20px;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;direction:ltr;text-align:left}
textarea.ans{min-height:120px;resize:vertical}
input.ans:focus,textarea.ans:focus{outline:none;border-color:var(--brand)}
.row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:11px 20px;font:inherit;font-size:17px;font-weight:700;cursor:pointer;background:var(--brand);color:#fff}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.fb{margin-top:16px;border-radius:14px;padding:12px 16px;font-size:17px}
.fb.ok{background:var(--ok-soft);color:#14532d}
.fb.bad{background:var(--bad-soft);color:#7f1d1d}
.fb.warn{background:var(--warn-soft);color:#713f12}
.fb .model{margin-top:6px}
.fb ul{margin:6px 0 0;padding-inline-start:20px}
/* build */
.zone{min-height:58px;border:2px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;direction:ltr;background:#fff;align-items:center}
.bank{display:flex;flex-wrap:wrap;gap:8px;direction:ltr;margin-top:12px}
.tile{border:2px solid #cfd8ee;background:var(--brand-soft);border-radius:10px;padding:7px 12px;font:inherit;font-size:19px;cursor:pointer}
.tile.used{visibility:hidden}
.zone .tile{background:#fff}
/* reading */
.reading{background:#fbf8f1;border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:18px;direction:ltr;text-align:left;font-size:18px;line-height:1.65}
.reading h4{margin:0 0 6px;font-size:20px}
.reading .sec{font-weight:700;margin-top:10px}
.reading p{margin:6px 0}
.reading .s{border-radius:6px;padding:1px 2px}
.reading.picking .s{cursor:pointer;background:#eef2fb;box-shadow:inset 0 -2px 0 #c9d6f3}
.reading.picking .s:hover{background:#dbe5fb}
.reading .s.ok{background:var(--ok-soft);box-shadow:inset 0 -2px 0 var(--ok)}
.reading .s.bad{background:var(--bad-soft);box-shadow:inset 0 -2px 0 var(--bad)}
details.rtoggle summary{cursor:pointer;color:var(--brand);font-weight:700;margin-bottom:8px}
.tf{display:flex;gap:10px}
.tf .opt{flex:1;text-align:center;direction:ltr}
.step{font-weight:700;margin:16px 0 8px}
/* summary */
.sum{text-align:center}
.sum .score{font-size:56px;font-weight:800;margin:6px 0}
.sum .bigstars{font-size:40px;letter-spacing:6px}
.mist{text-align:start;margin-top:18px}
.mist h4{margin:0 0 8px}
.mist li{margin-bottom:8px}
.tag{display:inline-block;background:var(--brand-soft);border-radius:8px;padding:0 8px;font-size:14px;color:var(--brand)}
/* explanations */
.exbtn{border:2px solid var(--brand);background:#fff;color:var(--brand);border-radius:12px;padding:7px 10px;font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.exbtn:hover{background:var(--brand-soft)}
.ex-head{display:flex;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.ex-head h2{margin:0;font-size:24px;flex:1}
.ex-sec{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin:12px 0}
.ex-sec h3{margin:0 0 8px;font-size:19px;color:var(--brand)}
.ex-sec p{margin:6px 0}
.ex-sec ul{margin:6px 0;padding-inline-start:22px}
.ex-sec li{margin:4px 0}
.ex-box{background:#fbf8f1;border-radius:12px;padding:10px 14px;margin:8px 0;direction:ltr;text-align:left;font-size:18px;line-height:1.7}
.ex-box .bad{color:var(--bad);text-decoration:line-through}
.ex-box .good{color:var(--ok);font-weight:700}
.key{background:var(--warn-soft);border-right:4px solid var(--mid);border-radius:10px;padding:10px 14px;margin:10px 0;font-weight:500}
table.rt{width:100%;border-collapse:collapse;margin:8px 0;font-size:17px}
table.rt th,table.rt td{border:1px solid var(--line);padding:7px 9px;text-align:start;vertical-align:top}
table.rt th{background:var(--brand-soft)}
table.rt td.e,table.rt th.e{direction:ltr;text-align:left}
.mark{color:var(--hard);font-weight:800}
.wordlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px;margin-top:6px}
.wordlist div{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fbf8f1;border-radius:10px;padding:6px 10px}
.wordlist .w{direction:ltr;font-weight:700}
.ex-start{display:flex;gap:8px;margin:18px 0 6px}
.modal{position:fixed;inset:0;background:rgba(20,24,35,.45);display:flex;align-items:flex-start;justify-content:center;padding:20px 10px;overflow:auto;z-index:50}
.modal .inner{background:var(--bg);border-radius:18px;max-width:820px;width:100%;padding:18px}
@media (max-width:520px){
  body{font-size:17px}
  h1{font-size:23px}
  .qtext{font-size:19px}
  .card{padding:16px}
}
</style>
</head>

const $ = (s, el=document) => el.querySelector(s);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function sample(a,n){return shuffle(a).slice(0,n);}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function en(s){return `<span class="en">${s}</span>`;}
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.85;speechSynthesis.speak(u);}catch(e){}}
const canSpeak = typeof window!=="undefined" && "speechSynthesis" in window;
function spk(t){return canSpeak?`<button class="speak" title="השמע" onclick="speak(${esc(JSON.stringify(t))})">🔊</button>`:"";}

/* מחולל שאלות אוצר מילים */
function genEnHe(list,n){
  return sample(list,n).map(([e,h])=>{
    const wrong=sample(list.filter(x=>x[0]!==e&&x[1]!==h),3).map(x=>x[1]);
    return {t:"mc",q:`מה הפירוש של ${en(`<span class="big">${esc(e)}</span>`)}? ${spk(e)}`,o:[h,...wrong],ans:`${e} = ${h}`};
  });
}
function genHeEn(list,n){
  return sample(list,n).map(([e,h])=>{
    const wrong=sample(list.filter(x=>x[0]!==e&&x[1]!==h),3).map(x=>x[0]);
    return {t:"mc",q:`איך אומרים באנגלית: <span class="big">${esc(h)}</span>?`,o:[e,...wrong],enOpts:true,ans:`${h} = ${e}`};
  });
}
const mcEn = (q,o,ex) => ({t:"mc",q,o,enOpts:true,ex});

  return shuffle([...p,...a,...genRules(4)]);

function genBank(n){
  return sample(BANK_Q,n).map(([q,a])=>{
    const al=a.toLowerCase(), avoid={popular:["famous"],famous:["popular"],afraid:[],glad:[]};
    const pool=BANK.filter(w=>w!==al && !(avoid[al]||[]).includes(w));
    const cap=/^___/.test(q), fix=w=>cap?w[0].toUpperCase()+w.slice(1):w;
    return {t:"mc",q:`בחר את המילה המתאימה:<br>${en("<b>"+esc(q)+"</b>")}`,o:[a,...sample(pool,3).map(fix)],enOpts:true,ans:q.replace("___",a)};
  });
}

function norm(s){
  s=String(s).toLowerCase().replace(/[’‘`]/g,"'");
  s=s.replace(/\bi'm\b/g,"i am").replace(/\b(he|she|it|that|what|where|who|there)'s\b/g,"$1 is")
     .replace(/\b(we|you|they)'re\b/g,"$1 are").replace(/\bisn't\b/g,"is not").replace(/\baren't\b/g,"are not")
     .replace(/\bcan't\b/g,"can not").replace(/\bdon't\b/g,"do not").replace(/\bdoesn't\b/g,"does not");
  return s.replace(/[^a-z0-9' ]/g," ").replace(/'/g," ").replace(/\s+/g," ").trim();
}
function formIssues(input, model){
  const t=input.trim(), issues=[];
  if(!/^[A-Z]/.test(t)) issues.push("משפט מתחיל באות גדולה.");
  const wantQ=/\?$/.test(model.trim());
  if(wantQ && !/\?$/.test(t)) issues.push("שאלה מסתיימת בסימן שאלה ?");
  else if(!wantQ && !/[.!]$/.test(t)) issues.push("משפט מסתיים בנקודה.");
  if(/(^|\s)i(\s|'|$)/.test(t)) issues.push("המילה I (אני) נכתבת תמיד באות גדולה.");
  model.split(/\s+/).slice(1).forEach(w=>{
    w=w.replace(/[^A-Za-z']/g,"");
    if(w && /^[A-Z]/.test(w) && w!=="I"){
      const re=new RegExp("\\b"+w.toLowerCase()+"\\b");
      if(re.test(t.toLowerCase()) && !new RegExp("\\b"+w+"\\b").test(t)) issues.push(`${w} – שם (של אדם/מקום/שפה) נכתב באות גדולה.`);
    }
  });
  return issues;
}

/* =========================================================
   מצב והצגה
   ========================================================= */
let S=null;
const app=$("#app");

function home(){
  S=null;
  const prog=loadProg();
  let html=`<header class="top"><div><h1>מתכוננים למבחן באנגלית 🇬🇧</h1><p class="sub">כיתה ו' – מבחן 1</p></div><div class="exam-chip">📅 המבחן: 24.11</div></header>
  <div class="howto">בכל נושא יש 3 שלבים: <b style="color:var(--easy)">קל</b> → <b style="color:var(--mid)">בינוני</b> → <b style="color:var(--hard)">קשה</b>. כדאי לקרוא קודם את ה<b>📘 הסבר</b>, ואז להתחיל בקל ולהתקדם. אפשר לפתוח את ההסבר גם באמצע התרגול. השאלות מתערבבות בכל פעם, אז אפשר לשחק שוב ושוב. ⭐⭐⭐ = 90% ומעלה.</div>`;
  let group="";
  TOPICS.forEach((t,ti)=>{
    if(t.group!==group){ if(group) html+=`</div>`; group=t.group; html+=`<div class="section-title">${group}</div><div class="grid">`; }
    html+=`<div class="topic"><div class="t-head"><div class="icon">${t.icon}</div><div><h3>${t.title}</h3><p>${t.desc}</p></div></div><button class="exbtn" onclick="explain(${ti})">📘 הסבר לפני התרגול</button><div class="levels">`;
    [0,1,2].forEach(l=>{
      const best=prog[t.id+"_"+l]; const st=best==null?"":("★".repeat(stars(best))+"☆".repeat(3-stars(best)));
      html+=`<button class="lvl l${l}" onclick="start(${ti},${l})">${LVL_NAMES[l]}<span class="stars">${st}</span></button>`;
    });
    html+=`</div></div>`;
  });
  html+=`</div><div class="resetall"><button class="linkbtn" onclick="if(confirm('לאפס את כל הכוכבים?')){saveProg({});home();}">איפוס התקדמות</button></div>`;
  app.innerHTML=html; window.scrollTo(0,0);
}
function stars(p){return p>=90?3:p>=70?2:p>=50?1:0;}

function start(ti,l){
  const t=TOPICS[ti];
  S={ti,l,topic:t,qs:t.levels[l](),i:0,score:0,max:0,mistakes:[],text:t.texts?t.texts[l]:null};
  S.max=S.qs.length;
  showQ();
}

function head(){
  const t=S.topic, pct=Math.round(S.i/S.qs.length*100);
  return `<div class="qbar"><button class="back" onclick="home()">→ חזרה</button><div class="qtitle">${t.icon} ${t.title}<span class="badge l${S.l}">${LVL_NAMES[S.l]}</span></div><button class="back" onclick="explainModal()">📘 הסבר</button></div>
  <div class="progress"><div style="width:${pct}%"></div></div>`;
}
function textHTML(txt){
  let h=`<h4>${txt.title} ${spk(txt.paras.filter(Array.isArray).flat().join(" "))}</h4>`;
  txt.paras.forEach(p=>{
    if(p.sec){h+=`<div class="sec">${p.sec}</div>`;return;}
    h+=`<p>`+p.map(s=>`<span class="s" data-s="${esc(s)}">${esc(s)}</span>`).join(" ")+`</p>`;
  });
  return h;
}

function showQ(){
  const q=S.qs[S.i];
  let h=head()+`<div class="card" id="card">`;
  if(S.text) h+=`<details class="rtoggle" open><summary>הטקסט (לחץ להסתרה/הצגה)</summary><div class="reading" id="reading">${textHTML(S.text)}</div></details>`;
  h+=`<div class="qnum">שאלה ${S.i+1} מתוך ${S.qs.length}</div>`;
  if(q.t==="mc"){
    const opts=(q.o.length===2||q.keepOrder)?q.o.slice():shuffle(q.o);
    h+=`<div class="qtext">${q.q}</div><div class="opts">`+opts.map(o=>`<button class="opt ${q.enOpts?"en-opt":""}" data-v="${esc(o)}">${q.enOpts?esc(o):o}</button>`).join("")+`</div>`;
  } else if(q.t==="type"){
    h+=`<div class="qtext">${q.q}</div>${q.form?`<div class="hint">שים לב לאות גדולה בהתחלה ולנקודה / סימן שאלה בסוף.</div>`:""}
      <input class="ans" id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type here..."><div class="row"><button class="btn" id="chk">בדיקה</button></div>`;
  } else if(q.t==="build"){
    const words=q.a.split(" "); const tiles=shuffle([...words,...(q.extra||[])]);
    h+=`<div class="qtext">${q.q}</div><div class="hint">לחץ על המילים לפי הסדר הנכון${q.extra?" (יש מילה אחת מיותרת!)":""}.</div>
      <div class="zone" id="zone"></div><div class="bank" id="bank">`+tiles.map((w,k)=>`<button class="tile" data-k="${k}">${esc(w)}</button>`).join("")+`</div>
      <div class="row"><button class="btn" id="chk">בדיקה</button><button class="btn ghost" id="clr">נקה</button></div>`;
  } else if(q.t==="open"){
    h+=`<div class="qtext">${en(esc(q.q))}</div><div class="hint">ענה במשפט שלם, עם כל המידע מהטקסט. מותר להעתיק מהטקסט.</div>
      <textarea class="ans" id="inp" spellcheck="false" placeholder="Write a full sentence..."></textarea><div class="row"><button class="btn" id="chk">בדיקה</button></div>`;
  } else if(q.t==="tfpick"){
    h+=`<div class="qtext">${en(esc(q.s))}</div><div class="step">א. TRUE או FALSE?</div>
      <div class="tf"><button class="opt" data-v="true">TRUE</button><button class="opt" data-v="false">FALSE</button></div><div id="step2"></div>`;
  } else if(q.t==="line"){
    h+=`<div class="qtext">${q.q}</div><div class="hint">כתוב באנגלית – משפט שלם, אות גדולה בהתחלה ונקודה בסוף.</div>
      <textarea class="ans" id="inp" spellcheck="false" style="min-height:80px" placeholder="Write here..."></textarea><div class="row"><button class="btn" id="chk">בדיקה</button></div>`;
  } else if(q.t==="free"){
    h+=`<div class="qtext">${q.q}</div><textarea class="ans" id="inp" spellcheck="false" style="min-height:170px" placeholder="This is my ..."></textarea><div class="row"><button class="btn" id="chk">בדיקה</button></div>`;
  }
  h+=`<div id="fb"></div></div>`;
  app.innerHTML=h; window.scrollTo(0,0);
  wire(q);
}

function wire(q){
  if(q.t==="mc"){
    document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const ok=b.dataset.v===q.o[0];
      document.querySelectorAll(".opt").forEach(x=>{x.disabled=true; if(x.dataset.v===q.o[0]) x.classList.add("ok");});
      if(!ok) b.classList.add("bad");
      finish(ok?1:0, ok?"כל הכבוד! ✔️":"לא נכון. התשובה הנכונה מסומנת בירוק.", q.ex, q.ans||plain(q.q)+" → "+stripTags(q.o[0]));
    });
  }
  if(q.t==="type"){
    const inp=$("#inp"); inp.focus();
    const go=()=>{
      const v=inp.value; if(!v.trim()) return;
      inp.disabled=true; $("#chk").disabled=true;
      const hit=q.a.find(a=>norm(a)===norm(v));
      if(!hit){ finish(0,"לא בדיוק.",q.ex||null,stripTags(q.q)+" → "+q.a[0],`<div class="model">תשובה נכונה: ${en("<b>"+esc(q.a[0])+"</b>")}${q.a.length>1?`<br>אפשר גם: ${q.a.slice(1).map(x=>en(esc(x))).join(" / ")}`:""}</div>`); return; }
      const iss=q.form?formIssues(v,hit):[];
      if(iss.length) finish(.5,"התוכן נכון! אבל שים לב לכתיבה:",q.form&&q.q.includes("סדר את")?q.ex:null,stripTags(q.q)+" → "+hit,`<ul>${iss.map(x=>`<li>${x}</li>`).join("")}</ul><div class="model">כך זה נכתב: ${en("<b>"+esc(hit)+"</b>")}</div>`,"warn");
      else finish(1,"מצוין! ✔️",null,null,q.a.length>1?`<div class="model">אפשר גם: ${q.a.filter(x=>x!==hit).map(x=>en(esc(x))).join(" / ")}</div>`:"");
    };
    $("#chk").onclick=go; inp.onkeydown=e=>{if(e.key==="Enter")go();};
  }
  if(q.t==="build"){
    const zone=$("#zone"), bank=$("#bank"); let order=[];
    const render=()=>{zone.innerHTML=order.map((k,idx)=>`<button class="tile" data-idx="${idx}">${esc(bank.querySelector(`[data-k="${k}"]`).textContent)}</button>`).join("");
      zone.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{const k=order.splice(+t.dataset.idx,1)[0];bank.querySelector(`[data-k="${k}"]`).classList.remove("used");render();});};
    bank.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{if(t.classList.contains("used"))return;t.classList.add("used");order.push(t.dataset.k);render();});
    $("#clr").onclick=()=>{order=[];bank.querySelectorAll(".tile").forEach(t=>t.classList.remove("used"));render();};
    $("#chk").onclick=()=>{
      if(!order.length) return;
      const v=order.map(k=>bank.querySelector(`[data-k="${k}"]`).textContent).join(" ");
      $("#chk").disabled=true; $("#clr").disabled=true; zone.querySelectorAll(".tile").forEach(t=>t.onclick=null); bank.querySelectorAll(".tile").forEach(t=>t.onclick=null);
      const ok=v===q.a;
      finish(ok?1:0, ok?"מצוין! ✔️":"לא בדיוק.", null, q.q+" → "+q.a, ok?"":`<div class="model">המשפט הנכון: ${en("<b>"+esc(q.a)+"</b>")}</div>`);
    };
  }
  if(q.t==="open"){
    const inp=$("#inp"); inp.focus();
    $("#chk").onclick=()=>{
      const v=inp.value.trim(); if(!v) return;
      inp.disabled=true; $("#chk").disabled=true;
      const low=v.toLowerCase();
      const got=q.keys.filter(k=>k.split("|").some(a=>low.includes(a)));
      const tips=[];
      if(v.split(/\s+/).length<3) tips.push("ענה במשפט שלם, לא רק במילה אחת.");
      if(!/^[A-Z]/.test(v)) tips.push("משפט מתחיל באות גדולה.");
      if(!/[.!?]$/.test(v)) tips.push("משפט מסתיים בנקודה.");
      const sc=got.length===q.keys.length?1:got.length?0.5:0;
      const msg=sc===1?"התשובה נכונה! ✔️":sc?"חלק מהמידע חסר.":"התשובה לא מתאימה לטקסט.";
      finish(sc,msg,null,q.q+" → "+q.model,`${tips.length?`<ul>${tips.map(x=>`<li>${x}</li>`).join("")}</ul>`:""}<div class="model">תשובה לדוגמה: ${en("<b>"+esc(q.model)+"</b>")}</div>`, sc===1&&!tips.length?"ok":sc===0?"bad":"warn");
    };
  }
  if(q.t==="tfpick"){
    let s1=0;
    document.querySelectorAll(".tf .opt").forEach(b=>b.onclick=()=>{
      const ok=(b.dataset.v==="true")===q.a; s1=ok?.5:0;
      document.querySelectorAll(".tf .opt").forEach(x=>{x.disabled=true; if((x.dataset.v==="true")===q.a) x.classList.add("ok");});
      if(!ok) b.classList.add("bad");
      $("#step2").innerHTML=`<div class="fb ${ok?"ok":"bad"}">${ok?"נכון!":"לא נכון – התשובה היא "+(q.a?"TRUE":"FALSE")+"."}</div>
        <div class="step">ב. ${en("Copy the sentence that shows this")} – לחץ על המשפט בטקסט שמוכיח את זה 👆</div>`;
      const rd=$("#reading"); rd.closest("details").open=true; rd.classList.add("picking");
      rd.scrollIntoView({behavior:"smooth",block:"start"});
      rd.querySelectorAll(".s").forEach(sp=>sp.onclick=()=>{
        rd.classList.remove("picking"); rd.querySelectorAll(".s").forEach(x=>x.onclick=null);
        const ok2=q.pick.includes(sp.dataset.s);
        if(!ok2) sp.classList.add("bad");
        rd.querySelectorAll(".s").forEach(x=>{if(q.pick.includes(x.dataset.s)) x.classList.add("ok");});
        const sc=s1+(ok2?.5:0);
        finish(sc, sc===1?"מצוין! גם TRUE/FALSE וגם המשפט נכונים ✔️":ok2?"המשפט נכון 👍":"המשפט הנכון מסומן בירוק.", null,
          `${q.s} → ${q.a?"TRUE":"FALSE"}: "${q.pick[0]}"`, `<div class="model">בתשובה כותבים: ${en(`<b>${q.a?"TRUE":"FALSE"}</b> – "${esc(q.pick[0])}"`)}</div>`, sc===1?"ok":sc===0?"bad":"warn");
      });
    });
  }
  if(q.t==="line"){
    $("#inp").focus();
    $("#chk").onclick=()=>{
      const v=$("#inp").value.trim(); if(!v) return;
      const low=v.toLowerCase().replace(/[’]/g,"'");
      const sents=v.split(/(?<=[.!?])\s+|\n+/).map(x=>x.trim()).filter(Boolean);
      const checks=[
        [sents.every(x=>/^[A-Z]/.test(x)),"כל משפט מתחיל באות גדולה"],
        [sents.every(x=>/[.!?]$/.test(x)),"כל משפט מסתיים בנקודה"],
        [!/(^|\s)i(\s|'|$)/.test(v),"המילה I כתובה באות גדולה"],
        ...q.req.map(([re,label])=>[new RegExp(re,"i").test(low),`השתמשת ב: <span class="en">${label}</span>`])
      ];
      const pass=checks.filter(c=>c[0]).length, sc=pass===checks.length?1:pass>=checks.length-1?.5:0;
      $("#chk").disabled=true; $("#inp").disabled=true;
      finish(sc, sc===1?"מצוין! ✔️":"כמעט! בדוק:", null, null,
        `<ul>${checks.map(c=>`<li>${c[0]?"✅":"❌"} ${c[1]}</li>`).join("")}</ul><div class="model">דוגמה: ${en(esc(q.model))}</div>`, sc===1?"ok":sc?"warn":"bad");
    };
  }
  if(q.t==="free"){
    $("#chk").onclick=()=>{
      const v=$("#inp").value.trim(); if(!v) return;
      const sents=v.split(/(?<=[.!?])\s+|\n+/).map(s=>s.trim()).filter(Boolean);
      const low=" "+v.toLowerCase().replace(/[^a-z' ]/g," ")+" ";
      const checks=[
        [sents.length>=4,`כתבת ${sents.length} משפטים (צריך לפחות 4)`],
        [sents.every(s=>/^[A-Z]/.test(s)),"כל משפט מתחיל באות גדולה"],
        [sents.every(s=>/[.!?]$/.test(s)),"כל משפט מסתיים בנקודה"],
        [/ (am|is|are|i'm|he's|she's|it's|we're|they're) /.test(low),"השתמשת ב-am / is / are"],
        [/ (has|have) /.test(low),"השתמשת ב-have / has"],
        [!/(^|\s)i(\s|'|$)/.test(v),"המילה I כתובה באות גדולה"],
      ];
      const pass=checks.filter(c=>c[0]).length;
      const sc=pass===checks.length?1:pass>=4?.5:0;
      $("#chk").disabled=true; $("#inp").disabled=true;
      finish(sc, sc===1?"כתיבה מצוינת! ✔️":"כמעט! בדוק את הרשימה:", null, null,
        `<ul>${checks.map(c=>`<li>${c[0]?"✅":"❌"} ${c[1]}</li>`).join("")}</ul><div class="model">דוגמה: ${en(esc(FREE_WRITE.model))}</div><div class="model" style="font-size:15px">💡 תבקש מאבא/אמא לבדוק גם את התוכן.</div>`, sc===1?"ok":"warn");
    };
  }
}
function stripTags(s){return String(s).replace(/<button[\s\S]*?<\/button>/g,"").replace(/<[^>]+>/g,"").replace(/\s+/g," ").trim();}
function plain(s){return stripTags(s);}

function finish(points,msg,ex,review,extra="",cls){
  S.score+=points;
  if(points<1 && review) S.mistakes.push(review);
  const c=cls||(points>=1?"ok":points>0?"warn":"bad");
  const last=S.i===S.qs.length-1;
  $("#fb").innerHTML=`<div class="fb ${c}"><b>${msg}</b>${ex?`<div class="model">💡 ${ex}</div>`:""}${extra||""}</div>
    <div class="row"><button class="btn" id="next">${last?"לסיכום 🏁":"הבא ←"}</button></div>`;
  const nx=$("#next"); nx.onclick=next; setTimeout(()=>nx.focus({preventScroll:true}),50);
  $("#fb").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function next(){ S.i++; if(S.i<S.qs.length) showQ(); else summary(); }

function summary(){
  const pct=Math.round(S.score/S.max*100), st=stars(pct);
  const prog=loadProg(), key=S.topic.id+"_"+S.l;
  if(prog[key]==null||pct>prog[key]){prog[key]=pct;saveProg(prog);}
  const msg=pct>=90?"מעולה! אתה מוכן! 🏆":pct>=70?"יפה מאוד! עוד קצת תרגול ⭐":pct>=50?"התחלה טובה – נסה שוב 💪":"כדאי לחזור על החומר ולנסות שוב 📚";
  const nextLvl=S.l<2&&pct>=70?`<button class="btn" onclick="start(${S.ti},${S.l+1})">לשלב ה${LVL_NAMES[S.l+1]} →</button>`:"";
  app.innerHTML=head().replace('style="width:'+Math.round(S.i/S.qs.length*100)+'%"','style="width:100%"')+`<div class="card sum">
    <div class="bigstars">${"★".repeat(st)}${"☆".repeat(3-st)}</div><div class="score">${pct}%</div><div style="font-size:20px;font-weight:700">${msg}</div>
    <div class="row" style="justify-content:center;margin-top:18px">${nextLvl}<button class="btn ghost" onclick="start(${S.ti},${S.l})">שוב 🔁</button><button class="btn ghost" onclick="home()">לכל הנושאים</button></div>
    ${S.mistakes.length?`<div class="mist"><h4>כדאי לחזור על:</h4><ul>${S.mistakes.map(m=>`<li><bdi>${esc(m)}</bdi></li>`).join("")}</ul></div>`:""}
  </div>`;
  window.scrollTo(0,0);
}

home();
</script>
